# Media download bounds. Only read when a media-capable plugin is enabled
# (duplicate.image_enabled or llm.image_enabled); see the README section
# "Photo Moderation" for the privacy, cost and outage implications.
# bot:
#   media:
#     # Largest Telegram photo the bot will download, in bytes (5 MiB).
#     # Larger variants are skipped, never blocked.
#     max_bytes: 5242880
#     # Deadline for one photo download. The update pump is serial, so the
#     # per-message worst case is this plus censor.timeout (5s + 30s).
#     timeout: 5s

telegram:
  proxy_url: "socks5://user:pass@127.0.0.1:1080" # optional SOCKS5 proxy

censor:
  strategy: sequential
  timeout: 30s
  enabled_only: true
  error_action: block
  skip_action: allow
  plugins:
    # Users plugin - provides simple user-based access control
    # Blacklists users (blocked) and whitelists users (explicitly allowed)
    users:
      enabled: true
      priority: 5
      config:
        blacklist: []
        whitelist: []

    # Forwarded messages restriction plugin
    # Blocks or allows forwarded messages based on source
    forwarded:
      enabled: true
      priority: 10
      config:
        # Optional: List of user IDs whose messages can be forwarded
        # allowed_user_ids:
        #   - 123456789  # Admin user ID
        #   - 987654321  # Trusted user ID

        # Optional: List of chat IDs whose messages can be forwarded
        # allowed_chat_ids:
        #   - -1001234567890  # Official channel ID (negative for supergroups/channels)
        #   - -1000987654321  # Another allowed chat

    ratelimit:
      enabled: true
      priority: 15
      config:
        max_messages: 5
        window: "1m"

    keyword:
      enabled: true
      priority: 20
      config:
        blacklist:
          - spam
          - scam
          - phishing

    regex:
      enabled: true
      priority: 25
      config:
        patterns:
          - '(?i)https?://[\w\-\.]+\.xyz' # Block .xyz domains
          - '\b\d{16}\b' # Block credit card numbers

    # Duplicate plugin - detects and blocks repetitive messages from users
    # This plugin tracks identical or very similar messages within a time window
    # and blocks users who exceed the maximum duplicate threshold.
    # Priority: 150 (runs after rate limit, keyword, and regex checks)
    duplicate:
      enabled: true
      priority: 150
      config:
        # Maximum number of duplicate messages allowed before blocking
        max_duplicates: 1

        # Time window to consider messages as duplicates
        # Messages sent within this timeframe are compared for similarity
        # Supported formats: "30s", "5m", "1h", "24h"
        window: "5m"

        # Also deduplicate photos by SHA-256 content hash (default: false)
        # Byte-identical only: re-uploads and re-encodes are NOT detected.
        # Requires a bot.media section above (or BOT__MEDIA__* env vars).
        image_enabled: false

    llm:
      enabled: true
      priority: 250
      config:
        api_key: "sk-1234567890"
        model: nvidia/nemotron-nano-9b-v2:free
        confidence_threshold: 0.8
        timeout: 30s
        prompt: 'Analyze the following message for inappropriate content, spam, or violations. Respond with JSON: {"inappropriate": boolean, "confidence": float, "reason": string}'
        temperature: 0.1
        # Enable caching for LLM responses to reduce API calls and improve performance
        cache_enabled: true # default: true
        # Time to live for cached responses (supported formats: "30s", "5m", "1h")
        cache_ttl: "1h" # default: "1h"
        # Maximum number of responses to cache
        # Applied PER MODALITY: text and photos each get their own cache.
        cache_max_size: 1000 # default: 1000

        # Photo moderation. Off by default; read the README section
        # "Photo Moderation" before turning it on. Every photo is base64-encoded and
        # sent to the provider named by base_url (OpenRouter by default), there is
        # no local spend ceiling, and a failed vision call deletes the message and
        # counts a violation against its sender.
        image_enabled: false # default: false
        # No default on purpose. Required when image_enabled is true.
        # vision_model: "your-vision-model-id"
        # Instruction sent with every photo; has a default.
        # image_prompt: "Analyze the attached photo..."
        # Optional local budget for one photo, in DECODED image bytes (the same
        # unit as bot.media.max_bytes, NOT base64-inflated or HTTP-body bytes).
        # 0 means no additional limit. Set it at or below bot.media.max_bytes.
        # This is local policy, not a provider limit: the provider publishes none.
        # max_inline_image_bytes: 0
