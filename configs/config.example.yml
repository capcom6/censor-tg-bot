telegram:
  proxy_url: "socks5://user:pass@127.0.0.1:1080" # optional SOCKS5 proxy

bot:
  media:
    max_bytes: 10485760 # maximum size of a downloaded photo (10 MiB)
    timeout: 5s # deadline for a single photo download

censor:
  strategy: sequential
  timeout: 30s
  enabled_only: true
  error_action: block
  skip_action: allow
  plugins:
    # Users plugin - provides simple user-based access control
    # Blacklists users (blocked) and whitelists users (explicitly allowed)
    users:
      enabled: true
      priority: 5
      config:
        blacklist: []
        whitelist: []

    # Forwarded messages restriction plugin
    # Blocks or allows forwarded messages based on source
    forwarded:
      enabled: true
      priority: 10
      config:
        # Optional: List of user IDs whose messages can be forwarded
        # allowed_user_ids:
        #   - 123456789  # Admin user ID
        #   - 987654321  # Trusted user ID

        # Optional: List of chat IDs whose messages can be forwarded
        # allowed_chat_ids:
        #   - -1001234567890  # Official channel ID (negative for supergroups/channels)
        #   - -1000987654321  # Another allowed chat

    ratelimit:
      enabled: true
      priority: 15
      config:
        max_messages: 5
        window: "1m"

    keyword:
      enabled: true
      priority: 20
      config:
        blacklist:
          - spam
          - scam
          - phishing

    regex:
      enabled: true
      priority: 25
      config:
        patterns:
          - '(?i)https?://[\w\-\.]+\.xyz' # Block .xyz domains
          - '\b\d{16}\b' # Block credit card numbers

    # Duplicate plugin - detects and blocks repetitive messages from users
    # This plugin tracks identical or very similar messages within a time window
    # and blocks users who exceed the maximum duplicate threshold.
    # Priority: 150 (runs after rate limit, keyword, and regex checks)
    duplicate:
      enabled: true
      priority: 150
      config:
        # Maximum number of duplicate messages allowed before blocking
        max_duplicates: 1

        # Time window to consider messages as duplicates
        # Messages sent within this timeframe are compared for similarity
        # Supported formats: "30s", "5m", "1h", "24h"
        window: "5m"

    # Decisions plugin - blocks messages via a decisions API
    # One request asks three atomic questions (category choice + two yes/no checks)
    # and the answers come back as calibrated probabilities.
    # Vendor-neutral: any endpoint implementing POST /decisions works via base_url.
    # Priority: 250
    decisions:
      enabled: false
      priority: 250
      config:
        # API key, preferably via CENSOR__PLUGINS__DECISIONS__CONFIG__API_KEY
        # api_key: "your-decisions-api-key"
        # Base URL of the decisions API
        # base_url: "https://openrouter.ai/api/alpha"
        model: perplexity/pplx-decider-v1.3:free # see https://openrouter.ai/models
        # Probability at or above which a violation blocks the message
        block_threshold: 0.7
        timeout: 30s
        # Optional context added to the state (group topic, rules)
        # context: "A group about cats"
        # Enable caching for decision answers to reduce API calls
        cache_enabled: true # default: true
        cache_ttl: "1h" # default: "1h"
        # Optional: override the question text (see README for the defaults)
        # questions:
        #   category:
        #     instructions: "Which category best describes the main purpose of the message?"
        #     criteria: { spam: "...", scam: "...", abuse: "...", other: "..." }
        #   spam:
        #     instructions: "Is this message unsolicited advertising or self-promotion?"
        #     criteria: { "true": "...", "false": "..." }
        #   abuse:
        #     instructions: "Is this message insulting, threatening, or harassing someone?"
        #     criteria: { "true": "...", "false": "..." }

    llm:
      enabled: true
      priority: 260
      config:
        api_key: "sk-1234567890"
        model: nvidia/nemotron-3.5-super-vl:free
        confidence_threshold: 0.8
        timeout: 30s
        prompt: 'Analyze the following message for inappropriate content, spam, or violations. Respond with JSON: {"inappropriate": boolean, "confidence": float, "reason": string}'
        temperature: 0.1
        # Enable caching for LLM responses to reduce API calls and improve performance
        cache_enabled: true # default: true
        # Time to live for cached responses (supported formats: "30s", "5m", "1h")
        cache_ttl: "1h" # default: "1h"
